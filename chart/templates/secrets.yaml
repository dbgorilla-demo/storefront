{{/*
Pre-created credential secrets. CNPG adopts an existing `<cluster>-app` secret
instead of generating a random one, so the credential is stable across
reconciles. Both are basic-auth so CNPG and the app can consume them uniformly.
This is composition-root material — the ONLY place a password is written, and
only the adapters (via env) ever read it.

The password itself is never in the chart. Precedence: an explicit value
(a deliberate rotation) wins; otherwise the live Secret's current password is
kept, so `helm upgrade` can never reset a rotated credential; otherwise, on a
fresh install, a random one is generated.
*/}}
{{- define "storefront.secretPassword" -}}
{{- $root := index . 0 -}}{{- $name := index . 1 -}}{{- $explicit := index . 2 -}}
{{- if $explicit -}}
{{- $explicit -}}
{{- else -}}
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace $name -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
{{- index $existing.data "password" | b64dec -}}
{{- else -}}
{{- randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cluster.owner }}
  password: {{ include "storefront.secretPassword" (list . (printf "%s-app" .Values.cluster.name) .Values.credentials.appPassword) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cluster.collectorRole }}
  password: {{ include "storefront.secretPassword" (list . (printf "%s-collector" .Values.cluster.name) .Values.credentials.collectorPassword) | quote }}
