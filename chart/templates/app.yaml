{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.cluster.name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    app.kubernetes.io/component: storefront-web
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels: {{- include "storefront.appSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "storefront.labels" . | nindent 8 }}
        app.kubernetes.io/component: storefront-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: PG_HOST
              value: {{ .Values.cluster.name }}-rw
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              value: {{ .Values.cluster.database }}
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.cluster.name }}-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.cluster.name }}-app, key: password }
            - name: TRAFFIC_QPS
              value: {{ .Values.app.trafficQps | quote }}
            - name: POOL_MIN
              value: {{ .Values.app.poolMin | quote }}
            - name: POOL_MAX
              value: {{ .Values.app.poolMax | quote }}
            - name: CHAOS_LOCK_PRODUCTS
              value: {{ .Values.app.chaos.lockProducts | quote }}
            - name: CHAOS_FLOOD_CONNECTIONS
              value: {{ .Values.app.chaos.floodConnections | quote }}
            - name: CHAOS_RUNAWAY_COUNT
              value: {{ .Values.app.chaos.runawayCount | quote }}
            - name: CHAOS_CHURN_BATCHES
              value: {{ .Values.app.chaos.churnBatches | quote }}
            - name: CHAOS_CHURN_ROWS
              value: {{ .Values.app.chaos.churnRows | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cluster.name }}-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "storefront.labels" . | nindent 4 }}
spec:
  selector: {{- include "storefront.appSelector" . | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.cluster.name }}-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "storefront.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.cluster.name }}-app
                port: { number: 8000 }
{{- end }}
{{- end }}
