apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "storefront.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.cluster.instances }}
  # Full-extension platform image: ships pg_stat_statements, hypopg, plpgsql,
  imageName: {{ .Values.cluster.image }}

  # CNPG's built-in Prometheus exporter (the "postgres exporter") is exposed on
  # port 9187 of every instance pod. enablePodMonitor emits a PodMonitor so a
  # Prometheus-operator stack scrapes it automatically; where Prometheus is
  # scrape target. Custom queries add storefront-specific gauges on top of the
  # default cnpg_* metric set.
  monitoring:
    enablePodMonitor: {{ .Values.cluster.monitoring.enablePodMonitor }}
    customQueriesConfigMap:
      - name: {{ .Values.cluster.name }}-metric-queries
        key: queries.yaml

  # Server tuning is declared in values.yaml (cluster.postgresParameters), so
  # every parameter is a one-line, reviewable change. CNPG reconciles changes on
  # `helm upgrade`: reload-only params (work_mem, random_page_cost) apply via
  # SIGHUP; restart-required params (shared_buffers, max_connections) trigger a
  # controlled rolling restart. See values.yaml for what each value means and
  postgresql:
    shared_preload_libraries:
      {{- toYaml .Values.cluster.sharedPreloadLibraries | nindent 6 }}
    parameters:
      {{- range $k, $v := .Values.cluster.postgresParameters }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}

  storage:
    size: {{ .Values.cluster.storageSize }}
    {{- with .Values.cluster.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  resources:
    requests:
      cpu: {{ .Values.cluster.resources.requests.cpu }}
      memory: {{ .Values.cluster.resources.requests.memory }}
    limits:
      cpu: {{ .Values.cluster.resources.limits.cpu }}
      memory: {{ .Values.cluster.resources.limits.memory }}

  # App database + owner role. Credentials are generated by CNPG into the
  # secret <cluster>-app; nothing in this repo hard-codes them.
  bootstrap:
    initdb:
      database: {{ .Values.cluster.database }}
      owner: {{ .Values.cluster.owner }}
      # Runs as superuser in the app database right after creation — the correct
      # place to install non-trusted extensions the app owner can't create.
      # DBGorilla connects as the (non-superuser) owner, so it CANNOT install
      # untrusted extensions itself ("must be superuser to create extension ...").
      # Anything DBGorilla's analyzers need must be pre-installed here.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS plpgsql
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements
        - CREATE EXTENSION IF NOT EXISTS hypopg
        # leading-wildcard product search (name ILIKE '%term%') from a seq scan
        # into an index scan -- the "add an index to fix search" beat.
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        # pgstattuple: exact table/index bloat measurement for the vacuum beats.
        - CREATE EXTENSION IF NOT EXISTS pgstattuple
        # plpgsql_check: the plpgsql linter DBGorilla's stored-procedure analyzer
        # uses. Active-mode checks work without shared_preload_libraries.
        - CREATE EXTENSION IF NOT EXISTS plpgsql_check
        # The DBGorilla collector connects as the owner; pg_monitor lets its
        # schema/topology refresh read pg_tablespace_size, pg_stat_*, etc.
        # Without this, SchemaRefresh errors at "Checking tablespaces".
        - GRANT pg_monitor TO {{ .Values.cluster.owner }}

  # A least-privilege role for the DBGorilla collector to register with:
  # SELECT + pg_monitor, no write. Declared as a managed role so CNPG owns it.
  # The SELECT half is granted by migration 0004, not here — post-init runs
  # before Alembic creates the `storefront` schema, so a GRANT on it at this
  # point would fail the bootstrap.
  managed:
    roles:
      - name: {{ .Values.cluster.collectorRole }}
        ensure: present
        login: true
        inRoles:
          - pg_monitor
        passwordSecret:
          name: {{ .Values.cluster.name }}-collector
