{{/*
Pre-created credential secrets. CNPG adopts an existing `<cluster>-app` secret
instead of generating a random one, so the credential is stable across
reconciles. Both are basic-auth so CNPG and the app can consume them uniformly.
This is composition-root material — the ONLY place a password is written, and
only the adapters (via env) ever read it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cluster.owner }}
  password: {{ .Values.credentials.appPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.name }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cluster.collectorRole }}
  password: {{ .Values.credentials.collectorPassword | quote }}
